<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Amber/Warning aura -->
  <circle cx="80" cy="80" r="72" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="2" />
  <circle cx="80" cy="80" r="54" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
  
  <!-- Robot Body -->
  <rect x="52" y="52" width="56" height="50" rx="16" fill="#F8FAFC" stroke="#92400E" stroke-width="2.5" />
  <rect x="60" y="64" width="40" height="20" rx="9" fill="#1C1917" />
  
  <!-- Inquisitive/Attention Amber Lenses -->
  <circle cx="70" cy="74" r="5" fill="#F59E0B" />
  <circle cx="70" cy="74" r="2" fill="#FFFFFF" />
  <circle cx="90" cy="74" r="5" fill="#F59E0B" />
  <circle cx="90" cy="74" r="2" fill="#FFFFFF" />
  
  <!-- Antenna with warning pulse -->
