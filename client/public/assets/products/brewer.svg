<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <rect width="300" height="300" rx="16" fill="#F4F4F3" />
  
  <defs>
    <radialGradient id="brShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="255" rx="55" ry="12" fill="url(#brShadow)" />

  <!-- Plunger Handle -->
  <path d="M120 50H180V62C180 66 176 70 172 70H128C124 70 120 66 120 62V50Z" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <!-- Plunger Shaft -->
  <rect x="142" y="70" width="16" height="50" fill="#64748B" />

  <!-- Outer Press Cylinder Chamber (Smoked Polypropylene) -->
  <rect x="115" y="115" width="70" height="110" rx="8" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2" />

  <!-- Measurement markings (1, 2, 3, 4) -->
  <line x1="125" y1="135" x2="135" y2="135" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <circle cx="145" cy="135" r="3" fill="#E2E8F0" />
  <line x1="125" y1="160" x2="135" y2="160" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <circle cx="145" cy="160" r="3" fill="#E2E8F0" />
  <line x1="125" y1="185" x2="135" y2="185" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <circle cx="145" cy="185" r="3" fill="#E2E8F0" />
  <line x1="125" y1="210" x2="135" y2="210" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <circle cx="145" cy="210" r="3" fill="#E2E8F0" />

  <!-- Hexagonal Filter Cap Base -->
  <rect x="108" y="225" width="84" height="20" rx="5" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <line x1="116" y1="235" x2="184" y2="235" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />
</svg>
