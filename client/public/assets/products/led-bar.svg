<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <rect width="300" height="300" rx="16" fill="#F4F4F3" />
  
  <defs>
    <radialGradient id="ledShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="210" rx="105" ry="12" fill="url(#ledShadow)" />

  <!-- Base Stand 1 (Left) -->
  <rect x="75" y="180" width="22" height="25" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
  <!-- Base Stand 2 (Right) -->
  <rect x="203" y="180" width="22" height="25" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />

  <!-- Main Aluminum Cylinder Bar Housing -->
  <rect x="45" y="145" width="210" height="36" rx="18" fill="#18181B" stroke="#27272A" stroke-width="2" />
  
  <!-- Glowing Light Diffuser Lens Bar -->
  <rect x="52" y="152" width="196" height="22" rx="11" fill="url(#glowGrad)" />
  <!-- Frosted Glass Specular Highlight -->
  <rect x="56" y="154" width="188" height="6" rx="3" fill="#FFFFFF" opacity="0.45" />

  <!-- Ambient Light Reflection onto Ground -->
  <ellipse cx="150" cy="205" rx="90" ry="10" fill="#8B5CF6" opacity="0.12" />
</svg>
