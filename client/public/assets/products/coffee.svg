<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <rect width="300" height="300" rx="16" fill="#F4F4F3" />
  
  <defs>
    <radialGradient id="cfShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A3425" />
      <stop offset="50%" stop-color="#382518" />
      <stop offset="100%" stop-color="#281A10" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="255" rx="70" ry="12" fill="url(#cfShadow)" />

  <!-- Coffee Pouch Body -->
  <path d="M102 85L92 235C92 245 102 248 150 248C198 248 208 245 208 235L198 85H102Z" fill="url(#bagGrad)" stroke="#1F140C" stroke-width="2" />

  <!-- Sealed Top Fold -->
  <path d="M98 70H202L198 85H102L98 70Z" fill="#281A10" stroke="#1F140C" stroke-width="2" />
  <line x1="102" y1="77" x2="198" y2="77" stroke="#684A35" stroke-dasharray="2 2" stroke-width="1.5" />

  <!-- Minimalist Clean Kraft Label -->
  <rect x="115" y="115" width="70" height="95" rx="4" fill="#FAF6ED" stroke="#DDD6C7" stroke-width="1" />
  <rect x="123" y="125" width="54" height="6" rx="1" fill="#281A10" />
  <text x="150" y="142" font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#382518" text-anchor="middle" letter-spacing="1">ORIGIN ROASTS</text>
  <text x="150" y="152" font-family="-apple-system, sans-serif" font-size="6" font-weight="600" fill="#B45309" text-anchor="middle">ETHIOPIAN YIRGACHEFFE</text>
  <line x1="125" y1="160" x2="175" y2="160" stroke="#E2D9C8" stroke-width="1" />
  <text x="150" y="172" font-family="-apple-system, sans-serif" font-size="5" fill="#6B5E51" text-anchor="middle">Washed Arabica · 500g</text>
  <text x="150" y="182" font-family="-apple-system, sans-serif" font-size="5" fill="#6B5E51" text-anchor="middle">Notes of Citrus &amp; Cocoa</text>

  <!-- Aroma Valve circle -->
  <circle cx="150" cy="100" r="4.5" fill="#281A10" stroke="#684A35" stroke-width="1" />
  <circle cx="150" cy="100" r="1.5" fill="#684A35" />
</svg>
