    <rect x="174" y="167" width="12" height="10" rx="2"/>
    <rect x="190" y="167" width="12" height="10" rx="2"/>
    <rect x="206" y="167" width="12" height="10" rx="2"/>
    <rect x="222" y="167" width="26" height="10" rx="2" fill="#059669"/>
  </g>
  <!-- Spacebar Row -->
  <g fill="#374151" stroke="#1F2937" stroke-width="1">
    <rect x="52" y="181" width="18" height="11" rx="2" fill="#4B5563"/>
    <rect x="74" y="181" width="14" height="11" rx="2"/>
    <rect x="92" y="181" width="14" height="11" rx="2"/>
    <!-- Spacebar Key -->
    <rect x="110" y="181" width="80" height="11" rx="2" fill="#6B7280"/>
    <rect x="194" y="181" width="14" height="11" rx="2"/>
    <rect x="212" y="181" width="14" height="11" rx="2"/>
    <rect x="230" y="181" width="18" height="11" rx="2" fill="#4B5563"/>
  </g>

  <!-- Rotary Volume Knob in top right -->
  <circle cx="238" cy="120" r="5" fill="#E5E7EB" stroke="#374151" stroke-width="1.5" />
