    <rect x="214" y="139" width="12" height="10" rx="2"/>
    <rect x="230" y="139" width="18" height="10" rx="2"/>
  </g>
  <!-- QWERTY Row -->
  <g fill="#374151" stroke="#1F2937" stroke-width="1">
    <rect x="52" y="153" width="18" height="10" rx="2" fill="#4B5563"/>
    <rect x="74" y="153" width="12" height="10" rx="2"/>
    <rect x="90" y="153" width="12" height="10" rx="2"/>
    <rect x="106" y="153" width="12" height="10" rx="2"/>
    <rect x="122" y="153" width="12" height="10" rx="2"/>
    <rect x="138" y="153" width="12" height="10" rx="2"/>
