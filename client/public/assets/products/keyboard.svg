<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <rect width="300" height="300" rx="16" fill="#F4F4F3" />
  
  <defs>
    <radialGradient id="kbShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D333B" />
      <stop offset="100%" stop-color="#1A1E24" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="225" rx="110" ry="16" fill="url(#kbShadow)" />

  <!-- Keyboard Case Perspective Chassis -->
  <rect x="40" y="115" width="220" height="95" rx="10" fill="url(#caseGrad)" stroke="#414853" stroke-width="2" />
  <!-- RGB Underglow Bar -->
  <line x1="50" y1="208" x2="250" y2="208" stroke="#10B981" stroke-width="2" opacity="0.8" />

  <!-- Key Rows -->
  <!-- Function Row -->
  <g fill="#374151" stroke="#1F2937" stroke-width="1" rx="2">
    <rect x="52" y="125" width="12" height="10" rx="2" fill="#4B5563"/>
    <rect x="68" y="125" width="12" height="10" rx="2"/>
    <rect x="84" y="125" width="12" height="10" rx="2"/>
    <rect x="100" y="125" width="12" height="10" rx="2"/>
    <rect x="116" y="125" width="12" height="10" rx="2"/>
    <rect x="132" y="125" width="12" height="10" rx="2"/>
    <rect x="148" y="125" width="12" height="10" rx="2"/>
    <rect x="164" y="125" width="12" height="10" rx="2"/>
    <rect x="180" y="125" width="12" height="10" rx="2"/>
    <rect x="196" y="125" width="12" height="10" rx="2"/>
    <rect x="212" y="125" width="12" height="10" rx="2"/>
    <rect x="228" y="125" width="20" height="10" rx="2" fill="#059669"/>
  </g>
  <!-- Number Row -->
  <g fill="#374151" stroke="#1F2937" stroke-width="1">
    <rect x="52" y="139" width="14" height="10" rx="2"/>
    <rect x="70" y="139" width="12" height="10" rx="2"/>
    <rect x="86" y="139" width="12" height="10" rx="2"/>
    <rect x="102" y="139" width="12" height="10" rx="2"/>
    <rect x="118" y="139" width="12" height="10" rx="2"/>
