  <!-- Home Row -->
  <g fill="#374151" stroke="#1F2937" stroke-width="1">
    <rect x="52" y="167" width="22" height="10" rx="2" fill="#4B5563"/>
    <rect x="78" y="167" width="12" height="10" rx="2"/>
    <rect x="94" y="167" width="12" height="10" rx="2"/>
    <rect x="110" y="167" width="12" height="10" rx="2"/>
    <rect x="126" y="167" width="12" height="10" rx="2"/>
